services:
  # Backend — FastAPI web service
  - type: web
    name: lost-found-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lost-found-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8

  # Frontend — Static site
  - type: static_site
    name: lost-found-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: lost-found-backend
          property: url

  # PostgreSQL database
  - type: postgresql
    name: lost-found-db
    plan: free
    databaseName: lost_found
    ipAllowList: []
